<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Campus - Room Availability</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #f5f7fb; color: #1b2430; }
    h1 { font-size: 1.3rem; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 12px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input[type=time] { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; margin-top: 14px; padding: 12px; font-size: 1rem; background: #1a3a6b; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    #result { margin-top: 14px; padding: 12px; border-radius: 8px; font-weight: 700; display: none; }
    .ok { background: #d9f5e3; color: #11693a; }
    .no { background: #fde1e1; color: #a31515; }
    ul { padding-left: 18px; margin: 6px 0 0; }
    #explanation { margin-top: 10px; padding: 12px; border-radius: 8px; background: #eef2f8; color: #33415c; font-weight: 400; display: none; font-size: 0.95rem; }
  </style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <h1>Smart Campus: Room R1 availability</h1>
  <div class="card">
    <b>Existing bookings (2026-11-02, UTC)</b>
    <ul><li>10:00 - 11:00</li><li>13:00 - 14:00</li></ul>
    <small>Fixed demo clock: 08:00. Max duration: 120 min.</small>
  </div>
  <div class="card">
    <label for="start">Start time</label>
    <input id="start" type="time" value="11:00" />
    <label for="end">End time</label>
    <input id="end" type="time" value="12:00" />
    <label><input id="blocked" type="checkbox" /> Room is blocked</label>
    <button id="check">Check availability</button>
    <div id="result" role="status"></div>
    <button id="explain" type="button" style="background:#4a6789;">Explain availability</button>
    <div id="explanation" role="status">
      <b>AI-generated explanation (mock)</b>
      <p id="explanationText" style="margin:6px 0 0;"></p>
    </div>
  </div>

  <script type="module">
    import { isRoomAvailable } from './src/availability.js';
    import { explainAvailability, buildExplainRequest } from './src/explainer.js';
    import { REASONS, DEMO_NOW, DEMO_BOOKINGS } from './src/constants.js';

    const NOW = DEMO_NOW;
    const bookings = DEMO_BOOKINGS;
    const messages = {
      [REASONS.OK]: 'The room is free for this time.',
      [REASONS.INVALID_RANGE]: 'Start time must be before end time.',
      [REASONS.IN_THE_PAST]: 'This time is in the past.',
      [REASONS.TOO_LONG]: 'Booking is longer than 120 minutes.',
      [REASONS.ROOM_BLOCKED]: 'The room is blocked.',
      [REASONS.OVERLAP]: 'The time overlaps an existing booking.',
    };

    let lastResult = null;

    document.getElementById('check').addEventListener('click', () => {
      const s = document.getElementById('start').value;
      const e = document.getElementById('end').value;
      const room = { id: 'R1', blocked: document.getElementById('blocked').checked };
      const res = isRoomAvailable(
        { start: `2026-11-02T${s}:00Z`, end: `2026-11-02T${e}:00Z` },
        bookings, room, NOW
      );
      const box = document.getElementById('result');
      box.style.display = 'block';
      box.className = res.available ? 'ok' : 'no';
      box.textContent = `${res.label}: ${messages[res.reason] || res.reason}`;
      lastResult = { ...res, roomLabel: 'R1', start: s, end: e };
      const exp = document.getElementById('explanation');
      exp.style.display = 'none';
    });

    // Invalidate any shown explanation when inputs change after a check,
    // so it can no longer be mistaken for the current status.
    for (const id of ['start', 'end', 'blocked']) {
      document.getElementById(id).addEventListener('change', () => {
        const exp = document.getElementById('explanation');
        exp.style.display = 'none';
        lastResult = null;
      });
    }

    document.getElementById('explain').addEventListener('click', async () => {
      const box = document.getElementById('explanation');
      const text = document.getElementById('explanationText');
      const request = buildExplainRequest(lastResult);
      if (!request) { box.style.display = 'block'; text.textContent = 'Check availability first.'; return; }
      const out = await explainAvailability(request);
      box.style.display = 'block';
      text.textContent = out.explanation;
    });
  </script>
</body>
</html>
